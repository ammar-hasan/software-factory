[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "software-factory"
version = "0.1.0"
description = "An open, local-first software factory: fleets of specialist agents that carry work from intake to a mergeable change, on a harness built for living specs, self-regulating memory, evals, and evolving skills."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Software Factory Authors" }]
keywords = ["agents", "sdlc", "automation", "llm", "orchestration", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.22",
]

[project.scripts]
sf = "software_factory.cli:main"

[project.urls]
Homepage = "https://github.com/ammar-hasan/software-factory"
Source = "https://github.com/ammar-hasan/software-factory"
Issues = "https://github.com/ammar-hasan/software-factory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff formats fenced Python inside Markdown, which is what we want for docs that teach --
# the examples stay canonical. The review reports are the exception: they quote the code
# exactly as it stood when the finding was written, and reformatting a quotation makes the
# finding harder to match against the commit it describes.
extend-exclude = ["docs/reviews"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
files = ["src/software_factory"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# Playwright is an *optional* runtime dependency: computer use is a granted capability, and
# a factory that never drives a browser must not be made to install one. `ui.py` imports it
# inside a function that returns `(False, reason)` when it is absent, which is the supported
# path -- but mypy sees the import and fails on a machine without it. So the typecheck
# passed on any developer machine with a browser installed and failed in CI, which is the
# worst possible arrangement: the check that exists to catch machine-specific problems was
# itself machine-specific.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests that touch the filesystem or network boundaries",
]

[tool.coverage.run]
source = ["src/software_factory"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
